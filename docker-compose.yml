services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chitfunds
      POSTGRES_USER: chitfunds
      POSTGRES_PASSWORD: chitfunds
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data:
