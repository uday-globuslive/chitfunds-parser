<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Chitfunds Parser{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  {% if user is defined %}
  <header class="topbar">
    <a class="brand" href="/dashboard">Chitfunds Parser</a>
    <div class="topbar-actions">
      {% if user.role == "admin" %}<a class="button secondary" href="/admin/users">Admin</a>{% endif %}
      <form method="post" action="/logout"><button class="button secondary" type="submit">Sign out</button></form>
    </div>
  </header>
  {% endif %}
  <main class="container">{% block content %}{% endblock %}</main>
</body>
</html>
